module_name: airship_att_control

parameters:
- group: Airship Rate Control
  definitions:
    AS_YAWRATE_P:
      description:
        short: Yaw rate P gain
        long: Yaw rate proportional gain, i.e. control output for angular speed error
          1 rad/s. Unused where the yaw rate loop stays open (see AS_YAWRATE_MAX).
      type: float
      default: 0.7
      min: 0.0
      max: 10.0
      decimal: 3
      increment: 0.01
    AS_YAWRATE_I:
      description:
        short: Yaw rate I gain
        long: Yaw rate integral gain. Compensates steady yaw disturbances such as wind.
          Unused where the yaw rate loop stays open (see AS_YAWRATE_MAX).
      type: float
      default: 0.09
      min: 0.0
      decimal: 3
      increment: 0.01
    AS_YR_INT_LIM:
      description:
        short: Yaw rate integrator limit
        long: Yaw rate integrator limit, in normalized yaw torque, the unit of the
          yaw torque setpoint the allocator serves. Can be set to increase the amount
          of integrator available to counteract disturbances such as wind, or reduced
          to improve settling time after large yaw moment trim changes. Unused where
          the yaw rate loop stays open (see AS_YAWRATE_MAX).
      type: float
      default: 0.3
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.01
    AS_YAWRATE_FF:
      description:
        short: Yaw rate feedforward
        long: Direct feedforward from yaw rate setpoint to yaw torque setpoint, i.e.
          control output for a yaw rate setpoint of 1 rad/s. Compensates the hull's
          yaw damping, so the torque that holds a turn comes from the setpoint and
          goes with it when the stick is released, instead of being built up in
          the integrator during the turn and unwound after it. Turning without
          forward speed the damping grows faster than linearly with the yaw rate,
          so a value that holds one turn rate there overshoots at smaller ones.
          Unused where the yaw rate loop stays open (see AS_YAWRATE_MAX).
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
      decimal: 3
      increment: 0.01
    AS_YAWRATE_MAX:
      description:
        short: Max yaw rate
        long: Full yaw stick deflection commands this yaw rate in every manual mode
          with rate control (Acro, Stabilized, Altitude, Position), provided the
          propulsion gets yaw to make. With the airship allocator (CA_AIRFRAME
          Airship) that means independent pods (CA_AIRSHIP_GRP) or a tail thruster
          (CA_AIRSHIP_TAIL), and yaw surfaces, if any, not credited in full
          (CA_AIRSHIP_CS_K below 1; the propulsion gets the uncredited share, so
          a credit close to 1 leaves the loop little authority at rest); any
          other allocator keeps the loop. Where yaw comes from control surfaces
          alone the stick stays yaw torque, as the loop has no airspeed scaling,
          and the AS_* yaw parameters do nothing. By design no parameter forces
          the loop on or off, as FW_ACRO_YAW_EN does on fixed-wing; it follows
          the allocator configuration alone. The stick passes through
          MAN_DEADZONE first, so the center band commands zero rate, unlike
          multicopter, fixed-wing and rover Acro, which apply no deadzone to the
          rate stick.
      type: float
      default: 15.0
      unit: deg/s
      min: 0.0
      max: 90.0
      decimal: 1
      increment: 1
